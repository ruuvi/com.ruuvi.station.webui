name: Deploy Prod

# Manual only: trigger from the Actions tab via "Run workflow".
# Never runs automatically on pushes. Pick the ref to ship; defaults to master.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      make-target: prod
    secrets: inherit
